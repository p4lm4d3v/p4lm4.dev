<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Repertoar</title>
    <style>
        :root {
            --bg-color: #121214;         /* Clean, neutral near-black */
            --card-bg: #1a1a1e;          /* Dark charcoal for the song rows */
            --card-hover: #222227;       /* Slightly lighter gray on hover */
            --text-color: #e3e3e6;       /* Crisp off-white */
            --accent-purple: #9d4edd;    /* Vibrant Royal Purple accent */
            --accent-glow: #7b2cbf;      /* Deeper purple for subtle shadows */
            --input-bg: #1e1e22;         /* Input background matching the theme */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 10px 0 20px 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            text-align: center;
            color: var(--accent-purple);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* Gives the main title a classy, subtle neon glow */
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        #search-bar {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            background-color: var(--input-bg);
            border: 1px solid #2d2d34;
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* The input pops with purple only when you click into it */
        #search-bar:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(123, 44, 191, 0.3);
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        .song-item-link {
            text-decoration: none;
            color: inherit;
            display: block;
            margin-bottom: 8px;
            outline: none;
        }

        .song-item {
            background-color: var(--card-bg);
            padding: 14px 18px;
            border-radius: 6px;
            border-left: 3px solid transparent;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.2s, border-left-color 0.2s, transform 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Hover states bring in the purple accents dynamically */
        .song-item-link:hover .song-item {
            border-left-color: var(--accent-purple);
            background-color: var(--card-hover);
            transform: translateX(3px); /* Subtle nudge right on hover */
        }

        .song-details {
            display: flex;
            align-items: center;
        }

        .author {
            font-weight: 700;
            color: #ffffff;
        }

        .divider {
            margin: 0 10px;
            color: #44444a; /* Muted gray divider */
            font-weight: 300;
        }

        .song-name {
            color: #b5b5bc;
        }

        .link-icon {
            color: #44444a;
            font-size: 0.85rem;
            font-weight: bold;
            transition: color 0.2s, transform 0.2s;
        }

        .song-item-link:hover .link-icon {
            color: var(--accent-purple);
            transform: scale(1.1);
        }

        .no-results {
            text-align: center;
            color: #55555c;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Moj Repertoar</h1>
            <input type="text" id="search-bar" placeholder="Search by song or artist..." autocomplete="off">
        </header>

        <main>
            <div id="repertoire-list" class="song-list"></div>
            <div id="empty-state" class="no-results" style="display: none;">Nema pronadjenih pesama.</div>
        </main>
    </div>

    <script>
        let allSongsFlattened = [];
        const searchBar = document.getElementById('search-bar');
        const repertoireList = document.getElementById('repertoire-list');
        const emptyState = document.getElementById('empty-state');

        async function loadRepertoire() {
            try {
                const response = await fetch('songs.json');
                if (!response.ok) throw new Error('Failed to fetch songs.json');

                const rawData = await response.json();

                rawData.forEach(artistGroup => {
                    const author = artistGroup.author;
                    if (Array.isArray(artistGroup.songs)) {
                        artistGroup.songs.forEach(songObj => {
                            allSongsFlattened.push({
                                author: author,
                                song: songObj.title,
                                link: songObj.link || '#'
                            });
                        });
                    }
                });

                allSongsFlattened.sort((a, b) => {
                    const authorCompare = a.author.localeCompare(b.author, undefined, { sensitivity: 'base' });
                    if (authorCompare !== 0) return authorCompare;
                    return a.song.localeCompare(b.song, undefined, { sensitivity: 'base' });
                });

                renderList(allSongsFlattened);
            } catch (error) {
                console.error("Error loading repertoire:", error);
                repertoireList.innerHTML = `<div class="no-results" style="color: #ff6b6b;">Error loading songs.json. Check local server configuration.</div>`;
            }
        }

        function renderList(songsToDisplay) {
            repertoireList.innerHTML = '';

            if (songsToDisplay.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            songsToDisplay.forEach(item => {
                const anchor = document.createElement('a');
                anchor.className = 'song-item-link';
                anchor.href = item.link;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';

                anchor.innerHTML = `
                    <div class="song-item">
                        <div class="song-details">
                            <span class="author">${item.author}</span>
                            <span class="divider">|</span>
                            <span class="song-name">${item.song}</span>
                        </div>
                        <div class="link-icon">↗</div>
                    </div>
                `;
                repertoireList.appendChild(anchor);
            });
        }

        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();

            if (!searchTerm) {
                renderList(allSongsFlattened);
                return;
            }

            const filtered = allSongsFlattened.filter(item => {
                return item.author.toLowerCase().includes(searchTerm) ||
                       item.song.toLowerCase().includes(searchTerm);
            });

            renderList(filtered);
        });

        loadRepertoire();
    </script>
</body>
</html>
